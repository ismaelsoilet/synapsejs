name: Release

# Publica por tag, nunca por push em main: o número da versão é uma decisão explícita.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: github-actions-release
    permissions:
      contents: read
      id-token: write

    steps:
      # Actions are pinned to full commit identifiers, and the toolchain is an explicit
      # version rather than a moving release channel.
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.2

      - name: Setup Node (for npm publish)
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      # The version is pinned — a moving `npm@latest` inside the publish job is how an
      # unrelated npm release can turn this pipeline red.
      - name: Install the pinned npm that supports trusted publishing
        run: npm install -g npm@12.2.0

      - name: Install Dependencies
        run: |
          bun install --frozen-lockfile
          node -e "const fs=require('fs'); if (!fs.existsSync('node_modules/synapsejs') && fs.existsSync('packages/synapse')) { try { fs.symlinkSync('../packages/synapse', 'node_modules/synapsejs', 'junction'); } catch(e){} }"

      - name: Tag Must Match The Package Version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            PKG=$(node -p "require('./packages/synapse/package.json').version")
            if [ "$TAG" != "$PKG" ]; then
              echo "tag $TAG != package.json $PKG — abortando"
              exit 1
            fi
            echo "versão conferida: $PKG"
          else
            echo "Execução manual via workflow_dispatch (ref: $GITHUB_REF_NAME)"
          fi

      - name: Framework Test Suite
        run: bun test packages/synapse/test

      - name: Typecheck
        run: bun run check

      - name: Documentation Drift Gate
        run: bun run docs:check

      - name: Split Gates
        run: bun run split

      - name: Oracles, Adoption App And E2E
        run: bun run test:all

      - name: Publish Rehearsal (the artifact a stranger would install)
        run: bun run rehearse:publish

      # Credentials: npm's trusted publishing (OIDC). The job requests `id-token: write`
      # and no npm token is configured for this repository, so npm exchanges the GitHub
      # OIDC identity for a short-lived publish credential and signs the provenance
      # statement. Setting an NPM_TOKEN secret would override that with a long-lived
      # token — the mechanism in use is the tokenless one.
      - name: Publish To npm
        run: npm publish --access public --provenance
        working-directory: packages/synapse
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

